[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sql-compiler"
version = "0.1.0"
description = "Tableau Prep-style flow generation from natural language via MCP + Claude Desktop"
requires-python = ">=3.11"
dependencies = [
    # MCP server (Claude Desktop integration)
    "mcp[cli]>=1.0.0",
    # LangChain (prompt templates, tool utilities)
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    # SQL parsing + dialect validation (deterministic checker)
    "sqlglot>=25.0.0",
    # Database / ORM
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # MySQL driver (optional at runtime)
    "pymysql>=1.1.0",
    # PostgreSQL driver (optional at runtime)
    "psycopg2-binary>=2.9.0",
    # Data models
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Env / config
    "python-dotenv>=1.0.0",
    # REST API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
hyper = ["tableauhyperapi>=0.0.19763"]
calcite = ["JPype1>=1.5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
